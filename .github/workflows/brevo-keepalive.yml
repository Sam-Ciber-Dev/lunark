name: Brevo keep-alive

# Keeps the Brevo free account active by pinging the keep-alive endpoint once a
# month. Brevo deactivates accounts after long periods without email sends.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEEP_ALIVE_URL  — full endpoint URL, e.g. https://lunark-two.vercel.app/api/cron/keep-alive
#   CRON_SECRET     — must match the CRON_SECRET env var set on Vercel

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::KEEP_ALIVE_URL and CRON_SECRET secrets must be set."
            exit 1
          fi
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$KEEP_ALIVE_URL")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive failed with HTTP $status"
            exit 1
          fi
